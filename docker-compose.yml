services:
  mysql:
    image: ${IMAGE_REGISTRY:-docker.m.daocloud.io}/library/mysql:8.0
    container_name: seckill-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: seckill
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./src/main/resources/sql/test-data.sql:/docker-entrypoint-initdb.d/test-data.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${IMAGE_REGISTRY:-docker.m.daocloud.io}/library/redis:7-alpine
    container_name: seckill-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: ${IMAGE_REGISTRY:-docker.m.daocloud.io}/library/rabbitmq:3.12-management-alpine
    container_name: seckill-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.m.daocloud.io}
    container_name: seckill-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/seckill?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-your-deepseek-api-key}
      JWT_SECRET: ${JWT_SECRET:-seckill-coupon-jwt-secret-key-32bytes}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  canal-server:
    profiles: ["full"]
    image: ${IMAGE_REGISTRY:-docker.m.daocloud.io}/canal/canal-server:v1.1.6
    container_name: seckill-canal
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      CANAL_IP: canal-server
      CANAL_PORT: 11111
    ports:
      - "11111:11111"
    volumes:
      - ./src/main/resources/canal/instance.properties:/home/admin/canal-server/conf/example/instance.properties

  prometheus:
    profiles: ["observability"]
    image: ${IMAGE_REGISTRY:-docker.m.daocloud.io}/prom/prometheus:v2.48.0
    container_name: seckill-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./src/main/resources/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    profiles: ["observability"]
    image: ${IMAGE_REGISTRY:-docker.m.daocloud.io}/grafana/grafana:10.2.0
    container_name: seckill-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  mysql-data:
  grafana-data:
