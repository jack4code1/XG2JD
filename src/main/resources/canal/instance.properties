# Canal Instance 配置
canal.instance.master.address=mysql:3306
canal.instance.dbUsername=root
canal.instance.dbPassword=${MYSQL_PASSWORD:-root123}
canal.instance.connectionCharset=UTF-8
canal.instance.enableDruid=false
canal.instance.filter.regex=seckill\\.t_coupon,seckill\\.t_order
canal.instance.filter.black.field.regex=seckill\\.t_user.password

# MQ 配置（RabbitMQ）
canal.mq.topic=cache.sync
canal.mq.partition=0
canal.mq.flatMessage=true
canal.serverMode=rabbitMQ
rabbitmq.host=rabbitmq:5672
rabbitmq.virtual.host=/
rabbitmq.username=admin
rabbitmq.password=${RABBITMQ_PASSWORD}
