# 本地配置示例：复制为 application-local.yml 后替换所有占位值。
# application-local.yml 已被 Git 忽略；不要将真实密码、Token 或 API Key 提交到仓库。

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/seckill?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: <your-mysql-password>
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: admin
    password: <your-rabbitmq-password>
  ai:
    openai:
      # 不在本地配置文件中写入密钥；由启动环境提供。
      api-key: ${DEEPSEEK_API_KEY}

seckill:
  jwt:
    secret: <at-least-32-random-characters>
