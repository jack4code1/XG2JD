server:
  port: 8080

spring:
  application:
    name: seckill-coupon

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        concurrency: 5
        max-concurrency: 10
        prefetch: 1

  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

# 项目自定义配置
seckill:
  auth:
    access-token-ttl-minutes: ${ACCESS_TOKEN_TTL_MINUTES:30}
  cache:
    active-logical-expire-seconds: ${CACHE_ACTIVE_LOGICAL_EXPIRE_SECONDS:30}
    active-physical-expire-seconds: ${CACHE_ACTIVE_PHYSICAL_EXPIRE_SECONDS:600}
  bloom-filter:
    expected-insertions: 1000000
    fpp: 0.01
  anti-fraud:
    window-seconds: 60
    max-requests-per-window: 10
  hot-key:
    window-seconds: 60
    slot-count: 12
    threshold-qps: 100
  order:
    expire-minutes: 15
  pending-order:
    max-retries: 10
    initial-publish-grace-ms: 5000
    recovery-lease-ms: 5000
    published-reconcile-ms: 30000
  jwt:
    secret: ${JWT_SECRET}
    access-expire-minutes: 30
    refresh-expire-days: 7

logging:
  level:
    com.seckill: DEBUG
