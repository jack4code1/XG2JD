server:
  port: 8080

spring:
  application:
    name: seckill-coupon

  datasource:
    url: jdbc:mysql://localhost:3306/seckill?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    listener:
      simple:
        concurrency: 5
        max-concurrency: 10
        prefetch: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

# 项目自定义配置
seckill:
  bloom-filter:
    expected-insertions: 1000000
    fpp: 0.01
  anti-fraud:
    window-seconds: 60
    max-requests-per-window: 10
  hot-key:
    window-seconds: 60
    slot-count: 12
    threshold-qps: 100
  order:
    expire-minutes: 15
  jwt:
    secret: ${JWT_SECRET:your-jwt-secret-min-32-bytes}
    access-expire-minutes: 30
    refresh-expire-days: 7

logging:
  level:
    com.seckill: DEBUG